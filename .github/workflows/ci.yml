name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Quality & Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

  test:
    name: API Tests (Unit, E2E & Standalone)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/saas_ci?replicaSet=rs0
      JWT_SECRET: ci_test_secret_key_with_at_least_32_characters
      RATE_LIMIT_STORE: mongodb
      ALLOW_PUBLIC_MULTI_REGISTER: "false"
      ALLOW_DIRECT_PLAN_CHANGE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: saas-app/package-lock.json

      - name: Start MongoDB replica set
        run: docker compose -f .devcontainer/docker-compose.yml up -d --wait mongodb

      - name: Install dependencies
        run: npm ci --prefix saas-app

      - name: Run unit and integration tests
        run: npm test --prefix saas-app

      - name: Run API end-to-end scripts
        run: npm run test:scripts --prefix saas-app

      - name: Start standalone MongoDB
        run: docker compose -f .github/docker-compose.standalone.yml up -d --wait

      - name: Test tenant deletion recovery on standalone
        env:
          STANDALONE_MONGO_URI: mongodb://127.0.0.1:27018/saas_standalone_ci
        run: npm run test:standalone --prefix saas-app

      - name: Dump MongoDB container logs on failure
        if: failure()
        run: |
          docker compose -f .devcontainer/docker-compose.yml logs || true
          docker compose -f .github/docker-compose.standalone.yml logs || true

      - name: Stop MongoDB instances
        if: always()
        run: |
          docker compose -f .github/docker-compose.standalone.yml down
          docker compose -f .devcontainer/docker-compose.yml down
