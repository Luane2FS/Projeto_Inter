# ==============================================================================
# Docker Compose - Ambiente de Produção / Integração Nuvem AWS
# Projeto Integrador: Capacita Computação em Nuvem
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Banco de Dados MongoDB 8.0 (Isolado estritamente na rede interna backend)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:8.0
    container_name: saas-mongodb
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    # Sem mapeamento de porta externa no host: isolamento total com internal: true
    volumes:
      - mongo-data:/data/db
    networks:
      - saas-backend-network
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Aplicação SaaS Multitenant (Node.js 22 + Express 5)
  # Intermediária entre a rede pública frontend e a rede interna de dados
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ./saas-app
      dockerfile: Dockerfile
    container_name: saas-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: "production"
      PORT: "${PORT:-3000}"
      MONGO_URI: "mongodb://mongodb:27017/saas"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET obrigatoria (minimo 32 caracteres). Configure em saas-app/.env ou no ambiente.}"
      ALLOW_PUBLIC_MULTI_REGISTER: "false"
      ALLOW_DIRECT_PLAN_CHANGE: "false"
      RATE_LIMIT_STORE: "mongodb"
      CORS_ORIGIN: "*"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - saas-frontend-network
      - saas-backend-network

# ------------------------------------------------------------------------------
# Volumes Persistentes (Mapeados no disco EBS desacoplado via bind mount)
# ------------------------------------------------------------------------------
volumes:
  mongo-data:
    name: saas-mongo-data

# ------------------------------------------------------------------------------
# Topologia de Redes em Camadas (Segurança em Profundidade)
# - saas-frontend-network: Rede bridge pública para entrada de tráfego na API
# - saas-backend-network: Rede estritamente INTERNA (internal: true) isolando o MongoDB
# ------------------------------------------------------------------------------
networks:
  saas-frontend-network:
    name: saas-frontend-network
    driver: bridge
  saas-backend-network:
    name: saas-internal-backend-network
    driver: bridge
    internal: true
